<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
<title id="title">Personal Agent Skills: collection and package structure</title>
<desc id="desc">Ten independent skills grouped by purpose: planning and research, building and verification, and Git workflows. A required SKILL.md carries each workflow, with optional references, scripts, assets, and Codex metadata. Selected packages are used by Codex or Claude Code with their own tools and permissions. Repository checks cover package structure, behavioral contracts, tests, types, and lint. Groups describe purposes, not a mandatory execution order.</desc>
