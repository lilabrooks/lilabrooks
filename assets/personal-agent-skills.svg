<svg xmlns="http://www.w3.org/2000/svg" width="800" height="515" viewBox="0 0 800 515" role="img" aria-labelledby="title desc">
<title id="title">Personal Agent Skills workflow example</title><desc id="desc">An example Git publishing workflow: inspect intended changes, verify while preserving unrelated work, publish within authorization, and confirm the remote result. Skills are independently usable, not a mandatory pipeline.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52677e"/></marker><marker id="start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52677e"/></marker></defs>
<rect width="800" height="515" rx="16" fill="#f8fafc"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><text x="32" y="44" font-size="29" fill="#172b42" font-weight="650" text-anchor="start">One example: publish a reviewed change</text><text x="32" y="80" font-size="23" fill="#40546b" font-weight="400" text-anchor="start">Independent skills for Codex and Claude Code</text><rect x="32" y="113" width="352" height="111" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="52" y="149" font-size="25" fill="#087f8c" font-weight="650" text-anchor="start">1  Inspect</text><text x="52" y="181" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Read the diff and Git state</text><text x="52" y="210" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Identify the intended changes</text><rect x="416" y="113" width="352" height="111" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="436" y="149" font-size="25" fill="#087f8c" font-weight="650" text-anchor="start">2  Verify</text><text x="436" y="181" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Select files and run checks</text><text x="436" y="210" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Preserve unrelated work</text><path d="M384 167 L415 167" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M592 224 L592 278" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="416" y="280" width="352" height="111" rx="12" fill="#ffffff" stroke="#7554b8" stroke-width="2"/><text x="436" y="316" font-size="25" fill="#7554b8" font-weight="650" text-anchor="start">3  Publish</text><text x="436" y="348" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Check scope and permission</text><text x="436" y="377" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Commit and push as requested</text><rect x="32" y="280" width="352" height="111" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="52" y="316" font-size="25" fill="#087f8c" font-weight="650" text-anchor="start">4  Confirm</text><text x="52" y="348" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Compare the remote result</text><text x="52" y="377" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Report what was published</text><path d="M416 335 L385 335" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="446" font-size="23" fill="#40546b" font-weight="400" text-anchor="start">Each package carries its own workflow and boundaries.</text><text x="32" y="482" font-size="23" fill="#40546b" font-weight="400" text-anchor="start">Also: goals · architecture decisions · repository QA</text></g></svg>
