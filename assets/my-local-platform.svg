<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
<title id="title">my-local-platform overview</title><desc id="desc">Relay is the first service; future services are planned. Both use a shared local platform for runtime, GitOps, messaging, databases, AWS-compatible APIs and observability. Live AWS validation is a separate opt-in path whose relay proof is pending.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52677e"/></marker><marker id="start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52677e"/></marker></defs>
<rect width="800" height="560" rx="16" fill="#f8fafc"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><text x="32" y="44" font-size="29" fill="#172b42" font-weight="650" text-anchor="start">A platform for more than one service</text><rect x="32" y="72" width="356" height="113" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="52" y="108" font-size="25" fill="#2563eb" font-weight="650" text-anchor="start">Relay · first service</text><text x="52" y="140" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Webhook delivery</text><text x="52" y="169" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Retries, ordering and replay</text><rect x="412" y="72" width="356" height="113" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2" stroke-dasharray="8 6"/><text x="432" y="108" font-size="25" fill="#087f8c" font-weight="650" text-anchor="start">Future services</text><text x="432" y="140" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Planned applications</text><text x="432" y="169" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Built on the shared platform</text><path d="M210 185 L210 221" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M590 185 L590 221" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="223" width="736" height="236" rx="12" fill="#eaf1ff" stroke="#2563eb" stroke-width="2"/><text x="52" y="260" font-size="27" fill="#2563eb" font-weight="650" text-anchor="start">Shared local platform</text><rect x="52" y="278" width="337" height="150" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="72" y="314" font-size="25" fill="#2563eb" font-weight="650" text-anchor="start">Run and deploy</text><text x="72" y="346" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Docker Compose</text><text x="72" y="375" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Kubernetes · ArgoCD</text><text x="72" y="404" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Local GitOps</text><rect x="411" y="278" width="337" height="150" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="431" y="314" font-size="25" fill="#2563eb" font-weight="650" text-anchor="start">Shared capabilities</text><text x="431" y="346" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Kafka · RabbitMQ · Postgres</text><text x="431" y="375" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">AWS-compatible APIs</text><text x="431" y="404" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">OpenTelemetry stack</text><text x="32" y="502" font-size="24" fill="#172b42" font-weight="650" text-anchor="start">Separate AWS validation path</text><text x="32" y="535" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Terraform · brief opt-in runs · live relay proof pending</text></g></svg>
