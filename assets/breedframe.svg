<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" role="img" aria-labelledby="title desc">
<title id="title">BreedFrame local inference overview</title><desc id="desc">Photo workspace connects to Scout. Scout uses text-only Qwen3 through Ollama for action choices and a separate Vision Transformer to read images. Recorded results feed local evidence and assessment rules. Scores are uncalibrated visual matches.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52677e"/></marker><marker id="start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52677e"/></marker></defs>
<rect width="800" height="580" rx="16" fill="#f8fafc"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><text x="32" y="44" font-size="29" fill="#172b42" font-weight="650" text-anchor="start">Local vision models + agent-directed tools</text><rect x="32" y="76" width="352" height="113" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="52" y="112" font-size="25" fill="#2563eb" font-weight="650" text-anchor="start">Photo workspace</text><text x="52" y="144" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Upload photos</text><text x="52" y="173" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Follow the investigation</text><rect x="416" y="76" width="352" height="113" rx="12" fill="#ffffff" stroke="#7554b8" stroke-width="2"/><text x="436" y="112" font-size="25" fill="#7554b8" font-weight="650" text-anchor="start">Scout</text><text x="436" y="144" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Chooses tools and next steps</text><text x="436" y="173" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Records their results</text><path d="M384 132 L415 132" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="416" y="235" width="352" height="116" rx="12" fill="#ffffff" stroke="#7554b8" stroke-width="2"/><text x="436" y="271" font-size="25" fill="#7554b8" font-weight="650" text-anchor="start">Qwen3 via Ollama</text><text x="436" y="303" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Selects actions from evidence</text><text x="436" y="332" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Text input; no image input</text><path d="M592 189 L592 234" fill="none" stroke="#7554b8" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#start)"/><rect x="32" y="235" width="352" height="116" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="52" y="271" font-size="25" fill="#087f8c" font-weight="650" text-anchor="start">Vision model · ViT</text><text x="52" y="303" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Reads the photo pixels</text><text x="52" y="332" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Ranks visual breed matches</text><path d="M416 162 L398 162 L398 210 L208 210 L208 234" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M208 351 L208 403" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="405" width="736" height="110" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="52" y="441" font-size="25" fill="#087f8c" font-weight="650" text-anchor="start">Local evidence and assessment</text><text x="52" y="473" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Photo history · tool results · model scores</text><text x="52" y="502" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Reporting rules determine whether evidence supports a report</text><text x="32" y="553" font-size="22" fill="#40546b" font-weight="400" text-anchor="start">Pretrained models · local inference · uncalibrated scores</text></g></svg>
